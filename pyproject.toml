[project]
name = "matmul-search"
version = "0.1.0"
description = "Open research log: searching for fast small-matrix multiplication schemes"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
markers = ["timeout(seconds): hard per-test time limit (default 10s)"]
